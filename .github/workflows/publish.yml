name: publish

# Publish to npm on version tags (v*) or a manual dispatch — no CI on plain
# main pushes. The published version comes from package.json — bump it with
# `npm version patch|minor|major` before tagging.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance attestations

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # --provenance needs a recent npm; Node 22 ships an older one
      - run: npm install -g npm@latest
      - name: Check version is not already published
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          if npm view "pi-coding-quota@$CURRENT" version >/dev/null 2>&1; then
            echo "::error::version $CURRENT is already on npm — bump package.json before publishing"
            exit 1
          fi
          echo "publishing $CURRENT"
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify on registry
        run: npm view pi-coding-quota version
